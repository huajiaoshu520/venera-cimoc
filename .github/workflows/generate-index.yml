name: 自动生成 index.json

on:
  workflow_dispatch:

  schedule:
    - cron: "30 19 * * *"

  push:
    paths:
      - "官方/**"
      - "三方/**"

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 生成 index.json
        run: |
          python .github/generate_index.py

      - name: 检查 index.json
        run: |
          echo "检查 index.json 是否存在..."

          if [ ! -f "index.json" ]; then
            echo "❌ index.json 没有生成"
            exit 1
          fi

          echo "✅ index.json 生成成功"
          echo
          echo "文件内容："
          cat index.json

      - name: 提交 index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json

          if git diff --cached --quiet; then
            echo "没有变化，不需要提交"
          else
            git commit -m "chore: 自动更新 index.json"
            git push
          fi
