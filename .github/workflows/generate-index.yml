name: 自动生成 index.json

on:
  workflow_dispatch:

  schedule:
    - cron: "30 19 * * *"

  push:
    paths:
      - "官方/**"
      - "三方/**"

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate index.json
        run: |
          python .github/generate_index.py

          echo "检查 index.json..."
          if [ ! -f "index.json" ]; then
            echo "错误：index.json 没有生成！"
            exit 1
          fi

          echo "index.json 生成成功："
          cat index.json

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json

          if git diff --cached --quiet; then
            echo "index.json 没有变化，不需要提交。"
          else
            git commit -m "chore: 自动更新 index.json"
            git push
          fi
